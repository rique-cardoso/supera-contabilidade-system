<div
  class="processo-card"
  draggable="true"
  data-processo-id="{{ processo.id }}"
  data-status="{{ processo.status }}"
>
  <div class="card-content">
    <div class="card-header">
      <div class="card-titulo">{{ processo.nome }}</div>
      <div class="card-acoes">
        <button
          class="btn-card-acao btn-editar-card"
          title="Editar"
          onclick="editarProcesso({{ processo.id }})"
        >
          <i class="fa-solid fa-pen-to-square"></i>
        </button>
        <div class="dropdown-opcoes-card">
          <button class="btn-card-acao btn-deletar-card btn-opcoes-dropdown" onclick="toggleMenuOpcoes(event, '{{ processo.id }}')" title="Mais opções">
            <i class="fa-solid fa-ellipsis"></i>
          </button>
          <div id="dropdown-{{ processo.id }}" class="dropdown-conteudo">
            <a href="#" onclick="softDeleteProcesso(event, '{{ processo.id }}')">
              <i class="fa-solid fa-trash-can"></i> Excluir Processo
            </a>
            {% if request.user.role == 'admin' %}
              <a href="#" class="btn-perigo" onclick="hardDeleteProcesso(event, '{{ processo.id }}')">
                <i class="fa-solid fa-skull-crossbones"></i> Apagar Definitivo
              </a>
            {% endif %}
          </div>
        </div>
      </div>
    </div>

    <div class="card-categoria">
      <i class="fa-solid fa-tag"></i> {{ processo.get_categoria_display }}
    </div>

    <div class="card-meta">
      <i class="fa-solid fa-calendar-days"></i>
      <span>{{ processo.data_vencimento_formatada }}</span>
    </div>

    <div class="card-meta">
      <i class="fa-solid fa-circle-minus icon-status" data-icon="EXCLUIDO"></i>
      <i class="fa-solid fa-circle-play icon-status" data-icon="ATIVO"></i>

      <svg
        class="icon-status feather feather-alert-circle"
        data-icon="VENCENDO"
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>

      <i class="fa-solid fa-circle-xmark icon-status" data-icon="VENCIDO"></i>
      <i class="fa-solid fa-circle-check icon-status" data-icon="CONCLUIDO"></i>

      <span class="card-status-text"></span>
    </div>

    <span class="card-protocolo">Protocolo: {{ processo.protocolo }}</span>
  </div>

  <div class="card-prazo">vencendo em {{ processo.dias_para_vencer }} dias</div>
</div>
