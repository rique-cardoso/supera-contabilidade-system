<div id="modalProcessoOverlay" class="modal-overlay" style="display: none">
  <div class="modal-content">
    <div class="modal-header">
      <div class="container_btn-close">
        <button onclick="fecharModalProcesso()" class="btn-close">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="container_title_prot">
        <h2 id="modalTitle">
          {{ processo.nome }}
        </h2>
        <div class="container-protocol">
          <span
            id="modalProtocoloBadge"
            class="badge-protocolo"
            style="display: none"
          ></span>
        </div>
      </div>
    </div>

    <form id="formProcesso" method="POST" action="">
      {% csrf_token %}

      <div class="form-group-full">
        <textarea
          name="descricao"
          id="id_descricao"
          placeholder="Adicionar descrição..."
          rows="4"
        ></textarea>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Número do Protocolo</label>
          <input type="text" name="protocolo" id="id_protocolo" required />
        </div>

        <div class="form-group">
          <label>Nome do Processo</label>
          <input type="text" name="nome" id="id_nome" required />
        </div>

        <div class="form-group">
          <label>Responsáveis</label>
          <select name="responsaveis" id="id_responsaveis" multiple>
            {% for usuario in usuarios %}
            <option value="{{ usuario.id }}">
              {{ usuario.username|default:usuario.email }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>Nome da Empresa</label>
          <select name="empresa" id="id_empresa" required>
            <option value="">Selecione a empresa</option>
            {% for empresa in empresas %}
            <option value="{{ empresa.id }}">{{ empresa.nome_empresa }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>Tipo (Categoria)</label>
          <select name="categoria" id="id_categoria">
            <option value="FUNCIONAMENTO">Funcionamento</option>
            <option value="CONSTRUCAO">Construção</option>
            <option value="SANITARIO">Sanitário</option>
          </select>
        </div>

        <div class="form-group">
          <label>Órgão</label>
          <select name="orgao" id="id_orgao">
            <option value="PREFEITURA">Prefeitura</option>
            <option value="BOMBEIROS">Bombeiros</option>
          </select>
        </div>

        <div class="form-group">
          <label>Data de Vencimento</label>
          <input type="date" name="data_vencimento" id="id_data_vencimento" />
          <small>Ao criar, é calculado automaticamente pelo sistema.</small>
        </div>
      </div>

      <div class="modal-footer">
        <button type="submit" class="btn-submit">Salvar Processo</button>
      </div>
    </form>
  </div>
</div>
