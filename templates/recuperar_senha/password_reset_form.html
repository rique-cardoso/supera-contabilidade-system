<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha | Supera</title>
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/login.css">
    <link rel="stylesheet" href="/static/css/password_reset.css">
</head>
<body>
    <div class="password-container">
        <img src="/static/img/logo-header.png" alt="Logo Supera" class="password-logo">

        <h2 class="password-title">Esqueceu a senha?</h2>

        <p class="password-description">
            Digite seu e-mail cadastrado e enviaremos um link para criar uma nova senha.
        </p>

        <form method="post" class="password-form">
            {% csrf_token %}

            <div class="form-group">
                <label>E-mail</label>
                <input type="email" name="email" required>
            </div>

            <button type="submit" class="password-btn">
                Enviar Link
            </button>

            <div style="text-align:center; margin-top:20px;">
                <a href="{% url 'login' %}" class="password-link">
                    Voltar para o Login
                </a>
            </div>
        </form>
    </div>
</body>
</html>
