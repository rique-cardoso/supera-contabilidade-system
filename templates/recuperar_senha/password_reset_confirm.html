<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nova Senha | Supera</title>
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/login.css">
    <link rel="stylesheet" href="/static/css/password_reset.css">
</head>
<body>
    <div class="password-container">

        <img src="/static/img/logo-header.png" alt="Logo Supera" class="password-logo">

        {% if validlink %}

            <h2 class="password-title">
                Criar Nova Senha
            </h2>

            <p class="password-description">
                Por favor, digite sua nova senha duas vezes para confirmar.
            </p>

            <form method="post" class="password-form">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="password-btn">
                    Salvar Nova Senha
                </button>
            </form>

        {% else %}

            <h3 class="password-error-title">
                Link Inválido
            </h3>

            <p class="password-description">
                O link de redefinição de senha é inválido ou já expirou.
                Por favor, solicite uma nova redefinição.
            </p>

            <a href="{% url 'password_reset' %}" class="password-link">
                Solicitar novamente
            </a>

        {% endif %}
    </div>
</body>
</html>
