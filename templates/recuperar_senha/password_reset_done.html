<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>E-mail Enviado | Supera</title>
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/password_reset.css">
</head>
<body>
    <div class="password-container">
        <i class="fa-solid fa-envelope-circle-check password-icon password-icon-success"></i>

        <h2 class="password-title">
            Verifique seu E-mail
        </h2>

        <p class="password-description">
            Se o e-mail informado existir em nossa base de dados,
            enviamos as instruções para redefinição de senha.
        </p>

        <a href="{% url 'login' %}" class="password-link">
            Voltar para o Login
        </a>
    </div>

    <script src="https://kit.fontawesome.com/bf92c72d09.js" crossorigin="anonymous"></script>
</body>
</html>
